# CookingGoMod runtime switches.
# This file is read at process load; edit it and relaunch the game.
#   objc=1     ObjC file-API hooks (NSData / NSFileManager / NSString) - JS injection path
#   posix=0    POSIX open-family hooks (fopen/open/openat/...) - invasive, opt-in
#   overlay=1  floating ball + panel UI
objc=1
posix=0
overlay=1