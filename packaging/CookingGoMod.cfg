# CookingGoMod runtime switches. Read once at app load; edit + relaunch to apply.
#   objc=1     ObjC file-API hooks (kept for diagnostics only)
#   posix=0    POSIX open-family hooks. WARNING: on Cooking GO 1.25.03 this layer
#              kills the process during startup. Keep 0.
#   overlay=1  floating ball + panel UI
#   panel=1    open the panel automatically at launch (layout diagnostics)
objc=1
posix=0
overlay=1
panel=0