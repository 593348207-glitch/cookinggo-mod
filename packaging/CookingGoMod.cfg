# CookingGoMod runtime switches. Read once at app load; edit + relaunch to apply.
#   objc=1     ObjC file-API hooks (diagnostics only)
#   posix=0    POSIX open-family hooks. WARNING: on Cooking GO 1.25.03 this kills the process. Keep 0.
#   overlay=1  floating ball + panel UI
#   panel=0    open the panel at launch (diagnostics)
#   rot=0      overlay rotation. The game is landscape and the overlay window is
#              already landscape, so 0 is correct. Only change if the panel ever
#              shows up sideways relative to the game on a new title/version.
objc=1
posix=0
overlay=1
panel=0
rot=0