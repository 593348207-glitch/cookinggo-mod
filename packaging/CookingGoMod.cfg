# CookingGoMod runtime switches. Read once at app load; edit + relaunch to apply.
#   objc=1     ObjC file-API hooks (diagnostics only)
#   posix=0    POSIX open-family hooks. WARNING: on Cooking GO 1.25.03 this kills the process. Keep 0.
#   overlay=1  floating ball + panel UI
#   panel=0    open the panel at launch (diagnostics)
#   rot=0      overlay rotation. The game and the overlay window are both
#              landscape, so 0 is correct.
#   vlog=0     mirror native diagnostics into the on-screen log area.
#              Keep 0 so the panel only shows the operator-facing results
#              (修改前 / 输入表达 / 修改后). Full diagnostics always go to
#              <container>/Documents/cookingmod/mod.log.
#   iap=0      seed the independent VIP/month-card IAP hook switch. Default 0
#              preserves all existing DEB behavior; the panel button can toggle
#              runtime state and persists it in Documents/cookingmod/iap_hook.json.
#   rt=0       experimental 1.26.02 ScriptEngine::evalString runtime bootstrap
#              hook. Default 0 preserves existing behavior; use rt=1 only after
#              the base 1.26.02 app launches cleanly and ABI is confirmed.
objc=1
posix=0
overlay=1
panel=0
rot=0
vlog=0
iap=0
rt=0
